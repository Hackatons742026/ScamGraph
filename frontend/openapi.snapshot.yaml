# Snapshot of /generated/api-contract.md v3 (contract v1, owner: codex-backend).
# Used by `npm run gen:api` until the backend serves /openapi.json (then: `npm run gen:api:live`).
# Do not invent fields here: change the contract doc first, then mirror it.
openapi: 3.1.0
info: { title: ScamGraph DNA API, version: "1" }
paths:
  /api/health:
    get:
      operationId: health
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
  /api/import:
    post:
      operationId: startImport
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/ImportRequest" } } }
      responses:
        "202": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/ImportResponse" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /api/runs/latest:
    get:
      operationId: getLatestRun
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RunSummary" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/runs/{id}:
    get:
      operationId: getRun
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RunSummary" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/incidents:
    get:
      operationId: listIncidents
      parameters:
        - { name: status, in: query, required: false, description: Comma-separated IncidentStatus values, schema: { type: string } }
        - { name: campaign, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/IncidentSummary" } } } } }
  /api/incidents/{id}:
    get:
      operationId: getIncident
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/IncidentDetail" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/artifacts/{id}:
    get:
      operationId: getArtifact
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ArtifactDetail" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/media/{id}:
    get:
      operationId: getMedia
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Image bytes
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/Error" }
  /api/campaigns:
    get:
      operationId: listCampaigns
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CampaignSummary" } } } } }
  /api/campaigns/{id}:
    get:
      operationId: getCampaign
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignDetail" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/campaigns/{id}/links:
    get:
      operationId: getCampaignLinks
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CampaignLink" } } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/graph:
    get:
      operationId: getGraph
      parameters:
        - { name: campaign, in: query, required: false, schema: { type: string } }
        - { name: tiers, in: query, required: false, description: "Comma-separated tiers, e.g. A,B", schema: { type: string } }
        - { name: levels, in: query, required: false, description: "Comma-separated levels, e.g. campaign,network", schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GraphResponse" } } } }
  /api/classify:
    post:
      operationId: classify
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files: { type: array, items: { type: string, format: binary } }
                text: { type: string }
                url: { type: string }
                exclude_incident: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ClassifyResult" } } } }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/eval/report:
    get:
      operationId: getEvalReport
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EvalReport" } } } }
  /api/edges/{id}/decision:
    post:
      operationId: decideEdge
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EdgeDecisionRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EdgeDecisionResponse" } } } }
        "501": { $ref: "#/components/responses/Error" }
  /api/campaigns/merge:
    post:
      operationId: mergeCampaigns
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MergeRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignDetail" } } } }
        "501": { $ref: "#/components/responses/Error" }
  /api/campaigns/split:
    post:
      operationId: splitCampaign
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SplitRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CampaignDetail" } } } } }
        "501": { $ref: "#/components/responses/Error" }
components:
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  schemas:
    Tier: { type: string, enum: [A, B, C] }
    Family: { type: [string, "null"], enum: [kit, tds, domain, creative, hosting, null] }
    Level: { type: string, enum: [campaign, network] }
    Outcome: { type: string, enum: [known_campaign, new_candidate, needs_review] }
    IncidentStatus: { type: string, enum: [in_campaign, unassigned, needs_review, new_candidate] }
    ArtifactKind: { type: string, enum: [har, html, mhtml, bundle, image, video, adlib_json, text, url, unknown] }
    ParseStatus: { type: string, enum: [ok, partial, failed, skipped] }
    FunnelRole: { type: string, enum: [ad, prelander, offer, order, unknown] }
    CoverageLevel: { type: string, enum: [ok, low] }
    RunStatus: { type: string, enum: [pending, running, done, failed] }
    ReasonKind: { type: string, enum: [match, coverage, conflict, weak] }
    DecisionKind: { type: string, enum: [confirm, reject] }
    ErrorResponse:
      type: object
      required: [error, detail]
      properties: { error: { type: string }, detail: { type: string } }
    Health:
      type: object
      required: [status, version]
      properties: { status: { type: string }, version: { type: string } }
    EvidenceItem:
      type: object
      required: [id, type, tier, family, display, weight, artifact_id, funnel_step, ignored, ignore_reason, detail]
      properties:
        id: { type: string }
        type: { type: string }
        tier: { $ref: "#/components/schemas/Tier" }
        family: { $ref: "#/components/schemas/Family" }
        display: { type: string }
        weight: { type: number }
        artifact_id: { type: string }
        funnel_step: { type: [integer, "null"] }
        ignored: { type: boolean }
        ignore_reason: { type: [string, "null"], description: "cdn_ip | public_lib | placeholder_phone | small_doc | high_df | other" }
        detail: { type: [string, "null"] }
    Coverage:
      type: object
      required: [artifact_kinds, has_har, has_page, has_image, has_video, has_adlib, has_text, level, badges]
      properties:
        artifact_kinds: { type: array, items: { $ref: "#/components/schemas/ArtifactKind" } }
        has_har: { type: boolean }
        has_page: { type: boolean }
        has_image: { type: boolean }
        has_video: { type: boolean }
        has_adlib: { type: boolean }
        has_text: { type: boolean }
        level: { $ref: "#/components/schemas/CoverageLevel" }
        badges: { type: array, items: { type: string } }
    Reason:
      type: object
      required: [kind, text, evidence]
      properties:
        kind: { $ref: "#/components/schemas/ReasonKind" }
        text: { type: string }
        evidence: { type: array, items: { $ref: "#/components/schemas/EvidenceItem" } }
    Decision:
      type: object
      required: [outcome, campaign_id, campaign_label, reasons, decided_at]
      properties:
        outcome: { $ref: "#/components/schemas/Outcome" }
        campaign_id: { type: [string, "null"] }
        campaign_label: { type: [string, "null"] }
        reasons: { type: array, items: { $ref: "#/components/schemas/Reason" } }
        decided_at: { type: string }
    Edge:
      type: object
      required: [id, source, target, level, tier, families, score, comparable, low_confidence, evidence]
      properties:
        id: { type: string }
        source: { type: string }
        target: { type: string }
        level: { $ref: "#/components/schemas/Level" }
        tier: { $ref: "#/components/schemas/Tier" }
        families: { type: array, items: { type: string } }
        score: { type: number }
        comparable: { type: integer }
        low_confidence: { type: boolean }
        evidence: { type: array, items: { $ref: "#/components/schemas/EvidenceItem" } }
    ArtifactSummary:
      type: object
      required: [id, kind, name_display, funnel_step, role, parse_status, error, captured_at, duplicate_of, observations]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/ArtifactKind" }
        name_display: { type: string }
        funnel_step: { type: [integer, "null"] }
        role: { oneOf: [{ $ref: "#/components/schemas/FunnelRole" }, { type: "null" }] }
        parse_status: { $ref: "#/components/schemas/ParseStatus" }
        error: { type: [string, "null"] }
        captured_at: { type: [string, "null"] }
        duplicate_of: { type: [string, "null"] }
        observations: { type: integer }
    RedirectHop:
      type: object
      required: [seq, url_display, status, kind]
      properties:
        seq: { type: integer }
        url_display: { type: string }
        status: { type: [integer, "null"] }
        kind: { type: string, enum: ["3xx", meta, js] }
    FunnelStep:
      type: object
      required: [step, role, artifact_ids, domain_display, redirect_chain]
      properties:
        step: { type: integer }
        role: { $ref: "#/components/schemas/FunnelRole" }
        artifact_ids: { type: array, items: { type: string } }
        domain_display: { type: [string, "null"] }
        redirect_chain: { type: array, items: { $ref: "#/components/schemas/RedirectHop" } }
    Media:
      type: object
      required: [id, kind, frame_ts, ocr_text, width, height]
      properties:
        id: { type: string }
        kind: { type: string, enum: [screenshot, frame, image] }
        frame_ts: { type: [number, "null"] }
        ocr_text: { type: [string, "null"] }
        width: { type: integer }
        height: { type: integer }
    IncidentSummary:
      type: object
      required: [id, label, first_seen, last_seen, artifact_count, coverage, status, campaign_id, campaign_label, network_id, outcome]
      properties:
        id: { type: string }
        label: { type: string }
        first_seen: { type: [string, "null"] }
        last_seen: { type: [string, "null"] }
        artifact_count: { type: integer }
        coverage: { $ref: "#/components/schemas/Coverage" }
        status: { $ref: "#/components/schemas/IncidentStatus" }
        campaign_id: { type: [string, "null"] }
        campaign_label: { type: [string, "null"] }
        network_id: { type: [string, "null"] }
        outcome: { oneOf: [{ $ref: "#/components/schemas/Outcome" }, { type: "null" }] }
        reason_summary: { type: [string, "null"] }
    IncidentDetail:
      allOf:
        - { $ref: "#/components/schemas/IncidentSummary" }
        - type: object
          required: [artifacts, funnel, evidence, decision, edges]
          properties:
            artifacts: { type: array, items: { $ref: "#/components/schemas/ArtifactSummary" } }
            funnel: { type: array, items: { $ref: "#/components/schemas/FunnelStep" } }
            evidence: { type: array, items: { $ref: "#/components/schemas/EvidenceItem" } }
            decision: { oneOf: [{ $ref: "#/components/schemas/Decision" }, { type: "null" }] }
            edges: { type: array, items: { $ref: "#/components/schemas/Edge" } }
    PageSummary:
      type: object
      required: [url_display, domain_display, title, role]
      properties:
        url_display: { type: string }
        domain_display: { type: string }
        title: { type: [string, "null"] }
        role: { oneOf: [{ $ref: "#/components/schemas/FunnelRole" }, { type: "null" }] }
    ArtifactDetail:
      allOf:
        - { $ref: "#/components/schemas/ArtifactSummary" }
        - type: object
          required: [pages, redirect_chain, media, ocr_text, request_count, hosts_display]
          properties:
            pages: { type: array, items: { $ref: "#/components/schemas/PageSummary" } }
            redirect_chain: { type: array, items: { $ref: "#/components/schemas/RedirectHop" } }
            media: { type: array, items: { $ref: "#/components/schemas/Media" } }
            ocr_text: { type: [string, "null"] }
            request_count: { type: integer }
            hosts_display: { type: array, items: { type: string } }
    CampaignSummary:
      type: object
      required: [id, label, level, size, incident_ids, first_seen, last_seen, strongest_evidence, network_id]
      properties:
        id: { type: string }
        label: { type: string }
        level: { $ref: "#/components/schemas/Level" }
        size: { type: integer }
        incident_ids: { type: array, items: { type: string } }
        first_seen: { type: [string, "null"] }
        last_seen: { type: [string, "null"] }
        strongest_evidence: { oneOf: [{ $ref: "#/components/schemas/EvidenceItem" }, { type: "null" }] }
        network_id: { type: [string, "null"] }
    TimelineEntry:
      type: object
      required: [date, incident_id, event]
      properties: { date: { type: string }, incident_id: { type: string }, event: { type: string } }
    CampaignDetail:
      allOf:
        - { $ref: "#/components/schemas/CampaignSummary" }
        - type: object
          required: [members, edges, timeline]
          properties:
            members: { type: array, items: { $ref: "#/components/schemas/IncidentSummary" } }
            edges: { type: array, items: { $ref: "#/components/schemas/Edge" } }
            timeline: { type: array, items: { $ref: "#/components/schemas/TimelineEntry" } }
    CampaignLink:
      type: object
      required: [other_id, other_label, level, shared_evidence]
      properties:
        other_id: { type: string }
        other_label: { type: string }
        level: { $ref: "#/components/schemas/Level" }
        shared_evidence: { type: array, items: { $ref: "#/components/schemas/EvidenceItem" } }
    GraphNode:
      type: object
      required: [id, kind, label, parent, outcome, coverage_level]
      properties:
        id: { type: string }
        kind: { type: string, enum: [incident, campaign, network, unassigned] }
        label: { type: string }
        parent: { type: [string, "null"] }
        outcome: { oneOf: [{ $ref: "#/components/schemas/Outcome" }, { type: "null" }] }
        coverage_level: { oneOf: [{ $ref: "#/components/schemas/CoverageLevel" }, { type: "null" }] }
    GraphResponse:
      type: object
      required: [nodes, edges]
      properties:
        nodes: { type: array, items: { $ref: "#/components/schemas/GraphNode" } }
        edges: { type: array, items: { $ref: "#/components/schemas/Edge" } }
    ImportRequest:
      type: object
      properties: { path: { type: string } }
    ImportResponse:
      type: object
      required: [run_id]
      properties: { run_id: { type: string } }
    ArtifactKindStats:
      type: object
      required: [total, parsed, failed]
      properties: { total: { type: integer }, parsed: { type: integer }, failed: { type: integer } }
    RunSummary:
      type: object
      required: [id, status, started_at, finished_at, incidents, artifacts, artifacts_by_kind, unique_artifacts, duplicates, campaigns, networks, unassigned, needs_review, new_candidates, secrets_redacted, error]
      properties:
        id: { type: string }
        status: { $ref: "#/components/schemas/RunStatus" }
        started_at: { type: string }
        finished_at: { type: [string, "null"] }
        incidents: { type: integer }
        artifacts: { type: integer }
        artifacts_by_kind: { type: object, additionalProperties: { $ref: "#/components/schemas/ArtifactKindStats" } }
        unique_artifacts: { type: integer }
        duplicates: { type: integer }
        campaigns: { type: integer }
        networks: { type: integer }
        unassigned: { type: integer }
        needs_review: { type: integer }
        new_candidates: { type: integer }
        secrets_redacted: { type: integer }
        error: { type: [string, "null"] }
    ClassifyResult:
      type: object
      required: [outcome, campaign_id, campaign_label, reasons, coverage, evidence, candidate_edges, elapsed_ms]
      properties:
        outcome: { $ref: "#/components/schemas/Outcome" }
        campaign_id: { type: [string, "null"] }
        campaign_label: { type: [string, "null"] }
        reasons: { type: array, items: { $ref: "#/components/schemas/Reason" } }
        coverage: { $ref: "#/components/schemas/Coverage" }
        evidence: { type: array, items: { $ref: "#/components/schemas/EvidenceItem" } }
        candidate_edges: { type: array, items: { $ref: "#/components/schemas/Edge" } }
        elapsed_ms: { type: number }
    MetricSet:
      type: object
      required: [precision, recall, f1, tp, fp, fn]
      properties:
        precision: { type: number }
        recall: { type: number }
        f1: { type: number }
        tp: { type: integer }
        fp: { type: integer }
        fn: { type: integer }
    EvalScenario:
      type: object
      required: [id, name, criterion, passed, details]
      properties:
        id: { type: integer, enum: [1, 2, 3, 4, 5, 6, 7] }
        name: { type: string }
        criterion: { type: string }
        passed: { type: boolean }
        details: { type: string }
    EvalPairs:
      type: object
      required: [n_pairs, mentor_verified, agreement, campaign, network]
      properties:
        n_pairs: { type: integer }
        mentor_verified: { type: integer }
        agreement: { type: [number, "null"] }
        campaign: { $ref: "#/components/schemas/MetricSet" }
        network: { $ref: "#/components/schemas/MetricSet" }
    LooRow:
      type: object
      required: [incident_id, expected, predicted, correct]
      properties:
        incident_id: { type: string }
        expected: { $ref: "#/components/schemas/Outcome" }
        predicted: { $ref: "#/components/schemas/Outcome" }
        correct: { type: boolean }
    LooReport:
      type: object
      required: [accuracy, rows, confusion]
      properties:
        accuracy: { type: number }
        rows: { type: array, items: { $ref: "#/components/schemas/LooRow" } }
        confusion:
          type: object
          required: [labels, matrix]
          properties:
            labels: { type: array, items: { $ref: "#/components/schemas/Outcome" } }
            matrix: { type: array, items: { type: array, items: { type: integer } } }
    AblationRow:
      type: object
      required: [config, campaign_p, campaign_r, false_merges, loo_routing]
      properties:
        config: { type: string }
        campaign_p: { type: number }
        campaign_r: { type: number }
        false_merges: { type: integer }
        loo_routing: { type: number }
    EvalReport:
      type: object
      required: [generated_at, scenarios, pairs, false_merges, loo, ablation]
      properties:
        generated_at: { type: [string, "null"] }
        scenarios: { type: array, items: { $ref: "#/components/schemas/EvalScenario" } }
        pairs: { $ref: "#/components/schemas/EvalPairs" }
        false_merges: { type: integer }
        loo: { $ref: "#/components/schemas/LooReport" }
        ablation: { type: array, items: { $ref: "#/components/schemas/AblationRow" } }
    EdgeDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision: { $ref: "#/components/schemas/DecisionKind" }
        note: { type: string }
    EdgeDecisionResponse:
      type: object
      required: [edge_id, decision, recorded_at]
      properties:
        edge_id: { type: string }
        decision: { $ref: "#/components/schemas/DecisionKind" }
        recorded_at: { type: string }
    MergeRequest:
      type: object
      required: [campaign_ids]
      properties:
        campaign_ids: { type: array, items: { type: string } }
        note: { type: string }
    SplitRequest:
      type: object
      required: [campaign_id, incident_ids]
      properties:
        campaign_id: { type: string }
        incident_ids: { type: array, items: { type: string } }
        note: { type: string }
