services:
  synthetic-seed:
    build:
      context: .
      target: synthetic-seed
    environment:
      SCAMGRAPH_SALT: ${SCAMGRAPH_SALT:-synthetic-docker-demo-salt}
    volumes:
      - scamgraph-state:/var/lib/scamgraph
    command:
      - sh
      - -c
      - >-
        if [ -f /var/lib/scamgraph/scamgraph.db ]; then
          echo 'Synthetic demo database already initialized';
        else
          python frontend/scripts/seed-synthetic-live-db.py /var/lib/scamgraph/scamgraph.db;
        fi

  app:
    build:
      context: .
      target: app
    depends_on:
      synthetic-seed:
        condition: service_completed_successfully
    environment:
      SCAMGRAPH_DB: /var/lib/scamgraph/scamgraph.db
      SCAMGRAPH_SALT: ${SCAMGRAPH_SALT:-synthetic-docker-demo-salt}
      SCAMGRAPH_CACHE_DIR: /var/lib/scamgraph/cache
    ports:
      - "${SCAMGRAPH_PORT:-8000}:8000"
    volumes:
      - scamgraph-state:/var/lib/scamgraph
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  backend-tests:
    profiles: [test]
    build:
      context: .
      target: backend-test
    environment:
      SCAMGRAPH_SALT: synthetic-test-salt

  frontend-tests:
    profiles: [test]
    build:
      context: .
      target: frontend-test

  live-smoke:
    profiles: [test]
    build:
      context: .
      target: frontend-test
    depends_on:
      app:
        condition: service_healthy
    environment:
      API_URL: http://app:8000
    command: ["npm", "run", "smoke:live"]

volumes:
  scamgraph-state:
